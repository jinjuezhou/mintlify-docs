                  msg:
                    type: string
                    example: OK
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                      status:
                        type: integer
                        enum:
                          - 1
                          - 2
                          - 3
                          - 4
                      url:
                        type: string
                      media_type:
                        type: string
                      progress:
                        type: number
                      analysis_result:
                        type: object
                        properties:
                          track_manifest_url:
                            type: string
                          media:
                            type: array
                            items:
                              type: object
                              properties:
                                obj_id:
                                  type: integer
                              additionalProperties: true
                        additionalProperties: true
                      error_reason:
                        type: string
      parameters:
        - name: _id
          in: query
          required: true
          description: Task or analysis ID belonging to the authenticated user/team.
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
