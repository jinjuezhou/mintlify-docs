          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1000
                  msg:
                    type: string
                    example: OK
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                      status:
                        type: integer
                        enum:
                          - 1
                          - 2
                          - 3
                          - 4
                      media_type:
                        type: string
                        enum:
                          - image
                          - video
                      model_name:
                        type: string
                      deduction_credit:
                        type: number
                      create_time:
                        type: number
                      progress:
                        type: number
                      url:
                        type: string
                      error_reason:
                        type: string
                      multi_shot_results:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
      parameters:
        - name: _id
          in: query
          required: true
          description: Task or analysis ID belonging to the authenticated user/team.
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
  /api/open/v5/characterSwap/analyze:
    post:
      operationId: characterSwap_analyze
      summary: Analyze Source Material — Character Swap
      tags:
        - Character Swap
      description: See the Character Swap V5 reference for model-specific constraints
        and conditional parameters. Authorization takes precedence when both
        authentication headers are supplied.
      responses:
        "200":
          description: Business response. Code 1000 means the request succeeded; inspect
            task status or data.errors for generation/submission outcomes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1000
                  msg:
                    type: string
                    example: OK
                  data:
                    type: object
                    additionalProperties: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: Public source material URL. Use the identical URL during task
                    creation.
                media_type:
                  type: string
                  description: "`image` or `video`; Head Swap requires video."
                  enum:
                    - image
                    - video
                type:
                  type: string
                  description: "Analysis category: `person`, `head`, or `outfit`; use the category
                    appropriate for this operation."
              required:
                - url
                - media_type
            example:
              url: https://example.com/source.jpg
              media_type: image
              type: person
  /api/open/v5/characterSwap/analyze/detail:
    get:
      operationId: characterSwap_analysis_result
