openapi: 3.0.3
info:
  title: Swap Studio V5 API
  version: 5.0.0
  description: Asynchronous character, motion, head, hair and clothing replacement APIs.
servers:
  - url: https://openapi.akool.com
security:
  - ApiKeyAuth: []
  - BearerAuth: []
paths:
  /api/open/v5/characterSwap/models:
    get:
      operationId: characterSwap_models
      summary: List Models — Character Swap
      tags:
        - Character Swap
      description: See the Character Swap V5 reference for model-specific constraints
        and conditional parameters. Authorization takes precedence when both
        authentication headers are supplied.
      responses:
        "200":
          description: Business response. Code 1000 means the request succeeded; inspect
            task status or data.errors for generation/submission outcomes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1000
                  msg:
                    type: string
                    example: OK
                  data:
                    type: object
                    properties:
                      list:
                        type: array
                        items: &a1
                          type: object
                          properties:
                            model_name:
                              type: string
                            label:
                              type: string
                            description:
                              type: string
                            icon:
                              type: string
                            provider:
                              type: string
                            params:
                              type: object
                              additionalProperties: true
                            unit_price_map:
                              type: object
                              additionalProperties: true
                            requires_priority:
                              type: number
  /api/open/v5/characterSwap/create:
    post:
      operationId: characterSwap_create
      summary: Create Task — Character Swap
      tags:
        - Character Swap
      description: See the Character Swap V5 reference for model-specific constraints
        and conditional parameters. Authorization takes precedence when both
        authentication headers are supplied.
      responses:
        "200":
          description: Business response. Code 1000 means the request succeeded; inspect
            task status or data.errors for generation/submission outcomes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1000
                  msg:
                    type: string
                    example: OK
                  data:
                    type: object
                    additionalProperties: true
              example:
                code: 1000
                msg: OK
                data:
                  list:
                    - _id: "670000000000000000000002"
                      status: 1
                      media_type: image
                      model_name: akool-premium-multi-person
                      deduction_credit: 6
                      create_time: 1791777600000
                  errors: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                media_type:
                  type: string
                  description: "`image` or `video`."
                  enum:
                    - image
                    - video
                target_url:
                  type: string
                  description: Public source scene image or video URL.
                model_name:
                  type: string
                  description: Defaults to `akool-premium-multi-person`. Get supported IDs from
                    the models endpoint.
                mappings:
                  type: array
                  description: "Image: 1–2 mappings with `source_url`, `source_bbox`, and
                    `target_bbox`. Akool video: 1–5 mappings with `obj_id` and
                    `img_url`."
                  items:
                    type: object
                    properties:
                      source_url:
                        type: string
                        description: Reference character image URL.
                      source_bbox:
                        type: array
                        description: Reference face bounding box `[x1,y1,x2,y2]` in original-image
                          pixels.
                        items:
                          type: number
                      target_bbox:
                        type: array
                        description: Target face bounding box `[x1,y1,x2,y2]` in original-image pixels.
                          The same target box cannot be mapped twice.
                        items:
                          type: number
                      obj_id:
                        type: integer
                        description: Person ID from the analysis result.
                      img_url:
                        type: string
                        description: Reference character image URL.
                analyze_id:
                  type: string
                  description: Completed analysis ID for the same source video.
                character_orientation:
                  type: string
                  description: "Kling video: `image` or `video`; defaults to `video`."
                  enum:
                    - image
                    - video
                image:
                  type: string
                  description: Reference character URL for a single-person Kling replacement.
                resolution:
                  type: string
                  description: Video output resolution. Select a value supported by the chosen
                    model.
                keep_original_sound:
                  type: boolean
                  description: Keep source video audio.
                prompt:
                  type: string
                  description: Optional generation instructions.
                webhookUrl:
                  type: string
                  description: Optional final-state callback URL; follow the [Webhook
                    guide](/ai-tools-suite/webhook).
              required:
                - media_type
                - target_url
            example:
              media_type: image
              target_url: https://example.com/scene.jpg
              model_name: akool-premium-multi-person
              mappings:
                - source_url: https://example.com/character.jpg
                  source_bbox:
                    - 10
                    - 20
                    - 200
                    - 400
                  target_bbox:
                    - 100
                    - 50
                    - 350
                    - 600
  /api/open/v5/characterSwap/task/detail:
    get:
      operationId: characterSwap_get_result
      summary: Get Task Result — Character Swap
      tags:
        - Character Swap
      description: See the Character Swap V5 reference for model-specific constraints
        and conditional parameters. Authorization takes precedence when both
        authentication headers are supplied.
      responses:
        "200":
          description: Business response. Code 1000 means the request succeeded; inspect
