  /api/open/v5/hairswap/create:
    post:
      operationId: hairswap_create
      summary: Create Task — Hair Swap
      tags:
        - Hair Swap
      description: Use images for reference-image batches or mappings for per-face selection.
        When mappings is supplied it takes precedence; top-level face indexes apply only
        to the images shortcut. Multi-person targets combine mappings into one primary
        task and each target face can appear only once. multi_shot=true requires a
        single-person target and at most 12 references (four outputs per primary task).
        Examples are illustrative; replace sample assets and IDs. Authorization takes
        precedence when both authentication headers are supplied.
      responses:
        "200":
          description: Business response. Code 1000 means the request succeeded; inspect task
            status or data.errors for generation/submission outcomes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1000
                  msg:
                    type: string
                    example: OK
                  data:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          $ref: "#/components/schemas/Task"
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            index:
                              type: integer
                              minimum: 0
                            error:
                              type: string
              examples:
                images:
                  summary: Reference images
                  value:
                    code: 1000
                    msg: OK
                    data:
                      list:
                        - _id: "670000000000000000000002"
                          status: 1
                          media_type: image
                          model_name: akool/hair-swap
                          deduction_credit: 6
                          create_time: 1791777600000
                          task_id: ""
                      errors: []
                mappings:
                  summary: Per-face mappings
                  value:
                    code: 1000
                    msg: OK
                    data:
                      list:
                        - _id: "670000000000000000000002"
                          status: 1
                          media_type: image
                          model_name: akool/hair-swap
                          deduction_credit: 6
                          create_time: 1791777600000
                          task_id: ""
                      errors: []
                multiShot:
                  summary: Single-person multiple views
                  value:
                    code: 1000
                    msg: OK
                    data:
                      list:
                        - _id: "670000000000000000000002"
                          status: 1
                          media_type: image
                          model_name: akool/hair-swap
                          deduction_credit: 6
                          create_time: 1791777600000
                          task_id: ""
                      errors: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target_url:
                  type: string
                  description: Public target portrait image URL.
                  format: uri
                images:
                  type: array
                  description: 1–50 reference URLs (at most 12 when multi_shot=true). Supply images or
                    mappings; mappings takes precedence.
                  items:
                    type: string
                    format: uri
                  minItems: 1
                  maxItems: 50
                mappings:
                  type: array
                  description: 1–50 per-face mappings (at most 12 when multi_shot=true). Takes precedence
                    over images. Each target face can appear once for a multi-person
                    target.
                  items:
                    type: object
                    properties:
                      source_url:
                        type: string
                        description: Reference hairstyle image URL.
                        format: uri
                      target_face_index:
                        type: integer
                        description: Zero-based target face index for this mapping; defaults to 0.
                        minimum: 0
                      source_face_index:
                        type: integer
                        description: Zero-based reference face index for this mapping; defaults to 0.
                        minimum: 0
                    required:
                      - source_url
                  minItems: 1
                  maxItems: 50
                multi_shot:
                  type: boolean
                  description: Generate three additional hairstyle views; defaults to false. Single-person
                    targets only.
                target_face_index:
                  type: integer
                  description: Zero-based face index for the images shortcut; defaults to 0. When using
                    mappings, set the index on each mappings[] object instead.
                  minimum: 0
                source_face_index:
                  type: integer
                  description: Zero-based face index for the images shortcut; defaults to 0. When using
                    mappings, set the index on each mappings[] object instead.
                  minimum: 0
                model_name:
                  type: string
                  description: Defaults to `akool/hair-swap`.
                webhookUrl:
                  type: string
                  description: Optional final-state callback URL; follow the [Webhook
                    guide](/ai-tools-suite/webhook).
                  format: uri
              required:
                - target_url
              anyOf:
                - required:
                    - mappings
                - required:
                    - images
            examples:
              images:
                summary: Reference images
                value:
                  target_url: https://example.com/portrait.jpg
                  images:
                    - https://example.com/hairstyle.jpg
                  target_face_index: 0
                  source_face_index: 0
                  model_name: akool/hair-swap
              mappings:
                summary: Per-face mappings
                value:
                  target_url: https://example.com/group.jpg
                  mappings:
                    - source_url: https://example.com/hairstyle.jpg
                      target_face_index: 0
                      source_face_index: 0
                    - source_url: https://example.com/hairstyle-2.jpg
                      target_face_index: 1
                      source_face_index: 0
                  model_name: akool/hair-swap
              multiShot:
                summary: Single-person multiple views
                value:
                  target_url: https://example.com/portrait.jpg
                  images:
                    - https://example.com/hairstyle.jpg
                  model_name: akool/hair-swap
                  multi_shot: true
      x-codeSamples:
        - lang: bash
          label: Reference images
          source: |-
            curl --request POST \
            --url 'https://openapi.akool.com/api/open/v5/hairswap/create' \
            --header 'x-api-key: <api-key>' \
            --header 'Content-Type: application/json' \
            --data '{
              "target_url": "https://example.com/portrait.jpg",
              "images": [
                "https://example.com/hairstyle.jpg"
              ],
              "target_face_index": 0,
              "source_face_index": 0,
              "model_name": "akool/hair-swap"
            }'
        - lang: bash
          label: Per-face mappings
          source: |-
            curl --request POST \
            --url 'https://openapi.akool.com/api/open/v5/hairswap/create' \
            --header 'x-api-key: <api-key>' \
            --header 'Content-Type: application/json' \
            --data '{
              "target_url": "https://example.com/group.jpg",
              "mappings": [
                {
                  "source_url": "https://example.com/hairstyle.jpg",
                  "target_face_index": 0,
                  "source_face_index": 0
                },
                {
                  "source_url": "https://example.com/hairstyle-2.jpg",
                  "target_face_index": 1,
                  "source_face_index": 0
                }
              ],
              "model_name": "akool/hair-swap"
            }'
        - lang: bash
          label: Single-person multiple views
          source: |-
            curl --request POST \
            --url 'https://openapi.akool.com/api/open/v5/hairswap/create' \
            --header 'x-api-key: <api-key>' \
            --header 'Content-Type: application/json' \
            --data '{
              "target_url": "https://example.com/portrait.jpg",
              "images": [
                "https://example.com/hairstyle.jpg"
              ],
              "model_name": "akool/hair-swap",
              "multi_shot": true
            }'
