  /api/open/v5/motionSwap/create:
    post:
      operationId: motionSwap_create
      summary: Create Task — Motion Swap
      tags:
        - Motion Swap
      description: See the Motion Swap V5 reference for model-specific constraints and
        conditional parameters. Authorization takes precedence when both
        authentication headers are supplied.
      responses:
        "200":
          description: Business response. Code 1000 means the request succeeded; inspect
            task status or data.errors for generation/submission outcomes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1000
                  msg:
                    type: string
                    example: OK
                  data:
                    type: object
                    additionalProperties: true
              example:
                code: 1000
                msg: OK
                data:
                  list:
                    - _id: "670000000000000000000002"
                      status: 1
                      media_type: video
                      model_name: kwaivgi/kling-v3.0-pro/motion-control
                      deduction_credit: 6
                      create_time: 1791777600000
                  errors: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                video:
                  type: string
                  description: Public driving video URL.
                images:
                  type: array
                  description: 1–50 public character image URLs. Each image creates an independent
                    video task.
                  items:
                    type: string
                model_name:
                  type: string
                  description: Motion-control model ID from the models endpoint.
                resolution:
                  type: string
                  description: Case-sensitive resolution supported by the selected model.
                mode:
                  type: string
                  description: "`animate` or `replace`, where supported by the model."
                  enum:
                    - animate
                    - replace
                prompt:
                  type: string
                  description: Optional instructions, up to 5000 characters.
                negative_prompt:
                  type: string
                  description: Optional negative instructions.
                character_orientation:
                  type: string
                  description: "`image` or `video`; model-specific duration limits apply."
                  enum:
                    - image
                    - video
                keep_original_sound:
                  type: boolean
                  description: Keep source audio in the generated video.
                duration:
                  type: number
                  description: Optional driving duration; must satisfy the selected model limits.
                webhookUrl:
                  type: string
                  description: Optional final-state callback URL; follow the [Webhook
                    guide](/ai-tools-suite/webhook).
              required:
                - video
                - images
                - model_name
            example:
              video: https://example.com/motion.mp4
              images:
                - https://example.com/character.jpg
              model_name: kwaivgi/kling-v3.0-pro/motion-control
              resolution: 720P
              character_orientation: video
              keep_original_sound: true
