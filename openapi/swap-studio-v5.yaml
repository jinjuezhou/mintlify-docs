                      status: 1
                      media_type: video
                      model_name: akool-premium
                      deduction_credit: 6
                      create_time: 1791777600000
                  errors: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                media_type:
                  type: string
                  description: Always `video`.
                  enum:
                    - video
                target_url:
                  type: string
                  description: Public source video URL; must match the completed analysis.
                analyze_id:
                  type: string
                  description: Completed head analysis ID.
                mappings:
                  type: array
                  description: 1–5 objects pairing detected people with reference images.
                  items:
                    type: object
                    properties:
                      obj_id:
                        type: integer
                        description: Person ID from the analysis result.
                      img_url:
                        type: string
                        description: Reference head image URL.
                model_name:
                  type: string
                  description: Defaults to `akool-premium`.
                resolution:
                  type: string
                  description: "`480p` or `720p`."
                keep_original_sound:
                  type: boolean
                  description: Keep source video audio.
                webhookUrl:
                  type: string
                  description: Optional final-state callback URL; follow the [Webhook
                    guide](/ai-tools-suite/webhook).
              required:
                - media_type
                - target_url
                - analyze_id
                - mappings
            example:
              media_type: video
              target_url: https://example.com/source.mp4
              analyze_id: "670000000000000000000001"
              mappings:
                - obj_id: 0
                  img_url: https://example.com/head.jpg
              model_name: akool-premium
              resolution: 720p
              keep_original_sound: true
